# Build the nightpanel .deb in a clean debian:trixie container and smoke-test the
# INSTALLED package on every v* tag.
#
# This is a PROOF run only — it deliberately does NOT publish. Shipping the .deb
# to the apt channel (apt.rizlabs.com) is a gated, manual act via
# `bin/deploy --publish` (ADR-073 DA6: public publish is explicit; CI must never
# auto-push to the public apt surface). Runs on the GitHub mirror — the estate's
# sanctioned runner (ADR-030); Forgejo stays git-only. This replaces the retired
# .forgejo/workflows/release-deb.yml, which both duplicated the apt channel and
# ran a Forgejo CI engine (ADR-030 violation).
#
# Native packaging: GitHub's runner is Ubuntu, so the build + install-smoke run
# INSIDE a debian:trixie container (the target distro). The host runner has node
# for actions/checkout; the container only runs shell, so checkout stays on the
# host and the workspace is mounted in.
name: release-deb

on:
  push:
    tags:
      - 'v*'

jobs:
  build-smoke:
    name: Build .deb + smoke-test (debian:trixie)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + smoke-test the package in a clean debian:trixie container
        run: |
          set -eux
          docker run --rm -v "$GITHUB_WORKSPACE:/w/src" -w /w/src debian:trixie bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates dpkg-dev
            # Build-deps come from debian/control (the single declared source) — not
            # a hand-maintained list that silently drifts out of sync (ADR-073 DA4).
            apt-get build-dep -y .
            dpkg-buildpackage -us -uc -b
            # Artifacts land in the parent of the build dir (/w). Install the built
            # package + design fonts, then smoke-test the INSTALLED package.
            apt-get install -y --no-install-recommends \
              /w/nightpanel_*.deb fonts-inter fonts-jetbrains-mono
            bash tests/smoke/gui-smoke.sh
          '
