name: dailydriver
base: core24
version: '0.2.0'
summary: Visual keyboard shortcut configuration for GNOME
description: |
  Daily Driver provides a videogame-like options UI for keyboard configuration.
  Easily customize your keyboard shortcuts, create profiles, and configure
  Mac keyboards on Linux.

grade: stable
confinement: strict

# Use the gnome extension to handle GTK4/Libadwaita boilerplate
apps:
  dailydriver:
    command: bin/dailydriver
    extensions: [gnome]
    common-id: io.github.gregfelice.DailyDriver
    desktop: share/applications/io.github.gregfelice.DailyDriver.desktop
    plugs:
      - gsettings
      - hardware-observe
      - system-observe
      - hid-apple-control

plugs:
  # Custom plug for hid-apple kernel module access
  # This requires manual review/approval from the Snap Store team
  hid-apple-control:
    interface: system-files
    write:
      - /sys/module/hid_apple/parameters/fnmode
      - /sys/module/hid_apple/parameters/swap_opt_cmd
      - /sys/module/hid_apple/parameters/swap_fn_leftctrl
      - /sys/module/hid_apple/parameters/iso_layout

parts:
  dailydriver:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
    build-environment:
      - PYTHONPATH: $SNAPCRAFT_PART_INSTALL/usr/lib/python3/dist-packages:$PYTHONPATH
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - blueprint-compiler
    stage-packages:
      - python3-gi
      - python3-pydantic
      - python3-tomli-w

  # Pydantic and other pure-python deps not in Ubuntu repos
  python-deps:
    plugin: python
    source: .
    python-packages:
      - pydantic
      - tomli-w
      - typing-extensions
      - annotated-types
