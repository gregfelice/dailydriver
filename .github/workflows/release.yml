name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Required so the auto-issued GITHUB_TOKEN can create the release.
    # Default token has read-only `contents` scope; without this, the
    # softprops action gets 403 from the releases API.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-appstream:
    name: Validate AppStream Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install appstream-util
        run: sudo apt-get update && sudo apt-get install -y appstream-util
      - name: Validate Metainfo
        run: appstream-util validate data/io.github.gregfelice.Nightpanel.metainfo.xml.in
