# Proof run for the .deb on every v* tag: build the package in a clean
# debian:trixie container, install it, and smoke-test the INSTALLED package.
#
# This runs the SAME command developers run locally — `bin/validate` (ADR-073
# DA1, the proof run) — so there is one shape everywhere (ADR-030); the container
# build + smoke logic lives only in bin/validate, never duplicated here.
#
# It deliberately does NOT publish. Shipping the .deb to the apt channel
# (apt.rizlabs.com) is the gated, manual `bin/deploy --publish` (DA6: CI never
# auto-pushes to the public apt surface). Runs on the GitHub mirror — the
# estate's sanctioned runner (ADR-030); Forgejo stays git-only.
name: release-deb (proof run)

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: bin/validate — .deb build + installed-package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the DA proof run
        run: bin/validate
