name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-flatpak:
    name: Build & Package Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: DailyDriver-${{ github.ref_name }}.flatpak
          manifest-path: io.github.gregfelice.DailyDriver.yml
          cache-key: flatpak-${{ github.sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DailyDriver-${{ github.ref_name }}.flatpak
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-snap:
    name: Build Snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.snapcraft.outputs.snap }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-appstream:
    name: Validate AppStream Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install appstream-util
        run: sudo apt-get update && sudo apt-get install -y appstream-util
      - name: Validate Metainfo
        run: appstream-util validate data/io.github.gregfelice.DailyDriver.metainfo.xml.in
