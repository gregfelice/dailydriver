# Build the Debian package and publish it to the Forgejo Debian registry on a
# version tag push (e.g. `git tag v0.2.6 && git push origin v0.2.6`).
#
# The package version comes from debian/changelog, NOT the tag — bump the
# changelog (new `nightpanel (X.Y-Z) ...` entry) in the same commit you tag, or
# the registry rejects a duplicate version.
#
# Requirements on the Forgejo instance:
#   - A runner with the `docker` label (this repo's runner: catthehacker/ubuntu).
#   - A repo/org Actions secret `PUBLISH_TOKEN` = a token with `write:package`
#     scope (used to upload the .deb). The auto `GITHUB_TOKEN` is used only to
#     clone the source.
#
# We run the build in a debian:trixie container so the package is native to the
# target. That image has no Node, so we clone manually instead of actions/checkout
# (a JS action) and keep every step a shell `run:`.

name: release-deb

on:
  push:
    tags:
      - 'v*'

jobs:
  build-publish:
    runs-on: docker
    container:
      image: debian:trixie
    steps:
      - name: Install build tooling
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl make dpkg-dev \
            debhelper dh-python meson ninja-build pkg-config \
            python3-all python3-setuptools \
            libgtk-4-dev libadwaita-1-dev gobject-introspection libgirepository1.0-dev

      - name: Fetch the tagged source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No `set -x`: keep the tokenized clone URL out of the logs.
          set -eu
          host=$(printf '%s' "${{ github.server_url }}" | sed -E 's#^https?://##')
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://${{ github.actor }}:${TOKEN}@${host}/${{ github.repository }}.git" src

      - name: Build the .deb
        run: |
          set -eux
          cd src
          dpkg-buildpackage -us -uc -b
          # dpkg-buildpackage writes artifacts to the parent dir (workspace root).

      - name: Publish to the Forgejo Debian registry
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -eu
          deb=$(ls *.deb | head -n1)
          test -n "$deb" || { echo "no .deb produced"; exit 1; }
          echo "publishing $deb"
          curl -sS --fail \
            -u "${{ github.repository_owner }}:${PUBLISH_TOKEN}" \
            --upload-file "$deb" \
            "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/debian/pool/trixie/main/upload"
